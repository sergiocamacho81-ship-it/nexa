const T = {
en: {
  kicker: "Admin Guide", docKicker: "Nexa · Organization admins",
  title: "Administering your organization",
  intro: "How to manage your Nexa organization itself — its name, its members, and their roles — from the in-app Settings page.",
  otherDocTitle: "Looking for the User Manual?",
  otherDocHint: "Contacts, deals, automations & more →",
  roleTh: ["Role", "Can do"],
  chapters: [
    { id: "roles", h: "Roles", body: `
      <p>Every person in an organization holds exactly one role <strong>in that organization</strong> — someone in two organizations can hold a different role in each.</p>
      <table class="role-table"><tr><th>Role</th><th>Can do</th></tr>
        <tr><td><span class="role-pill">Member</span></td><td>Everything in the User Manual: contacts, companies, deals, activities, tasks, email, automations, segments, campaigns. Can view Trash but not restore from it. Cannot open Settings.</td></tr>
        <tr><td><span class="role-pill">Admin</span></td><td>Everything a Member can, plus: rename the organization, configure its SMTP account, add/remove members, change members' roles, restore items from Trash.</td></tr>
        <tr><td><span class="role-pill">Owner</span></td><td>Everything an Admin can, plus: delete the organization itself. The only other difference from Admin is the “at least one Owner” protection below.</td></tr>
      </table>
    ` },
    { id: "rename", h: "Renaming the organization", body: `
      <p>Settings → the name field at the top → change it → <strong>Save</strong>. Takes effect immediately everywhere the organization name is shown.</p>
    ` },
    { id: "smtp", h: "Outbound email (SMTP)", body: `
      <p>Settings → <strong>Outbound email (SMTP)</strong>. Every organization configures its own SMTP account — there's no shared platform mailbox, so <strong>Email and Campaigns won't send until this is set</strong>: host, port, username, password, and the “from” address, plus whether to use TLS. Whoever manages your organization's mailbox (IT, the mail provider's admin panel) can give you these — the same settings you'd put into any email client.</p>
      <p>Leave the password field blank when saving other changes to keep the existing one; type a new one only when you're actually changing it.</p>
    ` },
    { id: "add", h: "Adding a member", body: `
      <ol class="steps">
        <li><span class="n">1</span>Open <strong>Settings → Add member</strong></li>
        <li><span class="n">2</span>Enter their email address</li>
        <li><span class="n">3</span>Pick a role (defaults to Member)</li>
        <li><span class="n">4</span>Click <strong>Add</strong></li>
      </ol>
      <div class="note"><span class="icon">i</span><span><strong>The person must already have a Nexa account.</strong> There is currently no email invitation — if they haven't signed up yet, ask them to create an account first, then add them by that email. Trying to add someone with no account returns an error saying so.</span></div>
    ` },
    { id: "role-change", h: "Changing a member's role", body: `
      <p>Settings → find the member's row → use the role dropdown next to their name → pick the new role. Takes effect immediately — no confirmation step, no save button.</p>
    ` },
    { id: "remove", h: "Removing a member", body: `
      <p>Settings → find the member's row → <strong>Remove</strong>. This removes their access to this organization only; it does not delete their Nexa account or affect any other organization they belong to.</p>
      <p>It's not instantly permanent — see <a href="#trash">Trash</a> below — and re-adding them by the same email (Settings → Add member) restores their exact previous role instead of starting fresh.</p>
    ` },
    { id: "owner-rule", h: "The “at least one Owner” rule", body: `
      <p>An organization can never end up with zero Owners: you cannot demote the last Owner to Admin/Member, and you cannot remove the last Owner. If you need to hand over ownership, first promote someone else to Owner, then change your own role or remove yourself.</p>
    ` },
    { id: "trash", h: "Trash (recovering deleted things)", body: `
      <p>Every delete in Nexa — a contact, company, deal, activity, task, segment, automation, campaign, or member — goes to <strong>Trash</strong> (in the nav) first, not straight to permanent deletion. It stays there for <strong>30 days</strong>; an OWNER or ADMIN can restore it from that page with one click. A Member can see what's in the Trash but not restore anything. After 30 days, an item that's still there is deleted for good the next time anyone opens the Trash page for that organization (there's no scheduled cleanup — just a check whenever the page is viewed).</p>
    ` },
    { id: "delete-org", h: "Deleting the organization", body: `
      <p>Settings → <strong>Danger zone</strong> → <strong>Delete organization</strong> (OWNER only, with a confirmation prompt). This moves the whole organization to a trash-like state: it disappears from everyone's organization list immediately, but <strong>you</strong> (the Owner who deleted it) can restore it from the organization list at <code>/app</code> within 30 days. After that, it's gone for good along with everything in it.</p>
    ` },
    { id: "not-covered", h: "What Settings doesn't cover", body: `
      <ul>
        <li><strong>Billing / plan limits</strong> — none exist yet; every organization has full, unlimited access to every module.</li>
      </ul>
    ` },
  ],

pt: {

    { id: "rename", h: "Renomear a organização", body: `
      <p>Definições → o campo do nome no topo → altera → <strong>Guardar</strong>. Tem efeito imediato em todos os sítios onde o nome da organização é mostrado.</p>
    ` },
    { id: "smtp", h: "Email de saída (SMTP)", body: `
      <p>Definições → <strong>Email de saída (SMTP)</strong>. Cada organização configura a sua própria conta SMTP — não há caixa de correio partilhada da plataforma, por isso <strong>o Email e as Campanhas não enviam enquanto isto não estiver configurado</strong>: servidor, porta, utilizador, password e endereço de envio (“from”), mais se deve usar TLS. Quem gere a caixa de correio da tua organização (TI, painel do teu fornecedor de email) pode dar-te estes dados — os mesmos que usarias em qualquer cliente de email.</p>
      <p>Deixa o campo da password em branco ao guardar outras alterações para manter a password atual; só escreve uma nova quando realmente a queres mudar.</p>
    ` },
    { id: "add", h: "Adicionar um membro", body: `
      <ol class="steps">
        <li><span class="n">1</span>Abre <strong>Definições → Adicionar membro</strong></li>
        <li><span class="n">2</span>Indica o email da pessoa</li>
        <li><span class="n">3</span>Escolhe um papel (por defeito Member)</li>
        <li><span class="n">4</span>Clica em <strong>Adicionar</strong></li>

      <div class="note"><span class="icon">i</span><span><strong>A pessoa já precisa de ter conta no Nexa.</strong> Atualmente não há convite por email — se ainda não se registou, pede-lhe para criar conta primeiro, e depois adiciona-a por esse email. Tentar adicionar alguém sem conta devolve um erro a indicar isso.</span></div>
    ` },
    { id: "role-change", h: "Mudar o papel de um membro", body: `
      <p>Definições → encontra a linha do membro → usa o menu do papel junto ao nome → escolhe o novo papel. Tem efeito imediato — sem passo de confirmação, sem botão de guardar.</p>
    ` },
    { id: "remove", h: "Remover um membro", body: `
      <p>Definições → encontra a linha do membro → <strong>Remover</strong>. Isto remove apenas o acesso a esta organização; não elimina a conta Nexa da pessoa nem afeta qualquer outra organização a que pertença.</p>
      <p>Não é logo definitivo — vê <a href="#trash">Lixo</a> abaixo — e voltar a adicionar a pessoa pelo mesmo email (Definições → Adicionar membro) restaura exatamente o papel que tinha antes, em vez de começar do zero.</p>

    ` },
    { id: "delete-org", h: "Eliminar a organização", body: `
      <p>Definições → <strong>Zona de perigo</strong> → <strong>Eliminar organização</strong> (só OWNER, com um pedido de confirmação). Isto move toda a organização para um estado tipo-lixo: desaparece da lista de organizações de todos imediatamente, mas <strong>tu</strong> (o Owner que a eliminou) podes restaurá-la a partir da lista de organizações em <code>/app</code> dentro de 30 dias. Depois disso, desaparece definitivamente com tudo o que contém.</p>

      </ul>
    ` },
  ],
},

    ` },
    { id: "smtp", h: "Email sortant (SMTP)", body: `
      <p>Paramètres → <strong>Email sortant (SMTP)</strong>. Chaque organisation configure son propre compte SMTP — il n'y a pas de boîte mail partagée au niveau de la plateforme, donc <strong>Email et Campagnes n'enverront rien tant que cela n'est pas configuré</strong> : serveur, port, nom d'utilisateur, mot de passe et adresse d'expédition, plus l'usage ou non de TLS. Quiconque gère la boîte mail de votre organisation (IT, panneau d'administration de votre fournisseur d'email) peut vous donner ces informations — les mêmes que vous mettriez dans n'importe quel client de messagerie.</p>
      <p>Laissez le champ du mot de passe vide en enregistrant d'autres modifications pour conserver le mot de passe actuel ; n'en saisissez un nouveau que si vous le changez réellement.</p>
    ` },
    { id: "add", h: "Ajouter un membre", body: `
      <ol class="steps">
        <li><span class="n">1</span>Ouvrez <strong>Paramètres → Ajouter un membre</strong></li>
        <li><span class="n">2</span>Indiquez son adresse email</li>
        <li><span class="n">3</span>Choisissez un rôle (par défaut Membre)</li>
        <li><span class="n">4</span>Cliquez sur <strong>Ajouter</strong></li>
      </ol>
      <div class="note"><span class="icon">i</span><span><strong>La personne doit déjà avoir un compte Nexa.</strong> Il n'y a actuellement pas d'invitation par email — si elle ne s'est pas encore inscrite, demandez-lui de créer un compte d'abord, puis ajoutez-la avec cet email. Essayer d'ajouter quelqu'un sans compte renvoie une erreur l'indiquant.</span></div>

      <p>Ce n'est pas immédiatement définitif — voir <a href="#trash">Corbeille</a> ci-dessous — et le réajouter avec le même email (Paramètres → Ajouter un membre) restaure exactement son rôle précédent au lieu de repartir de zéro.</p>

de: {

let current = "en";

function render(lang) {
  const t = T[lang];
  current = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (t[key]) el.innerHTML = t[key];
  });

  const toc = document.getElementById("toc");
  toc.innerHTML = '<div class="toc-label">' + (lang === "en" ? "Chapters" : lang === "pt" ? "Capítulos" : lang === "fr" ? "Chapitres" : lang === "de" ? "Kapitel" : "Capitoli") + '</div>' +
    t.chapters.map((c, i) => `<a href="#${c.id}"><span class="num">${String(i + 1).padStart(2, "0")}</span>${c.h}</a>`).join("");

  const chapters = document.getElementById("chapters");
  chapters.innerHTML = t.chapters.map((c, i) => `
    <section class="chapter" id="${c.id}">
      <div class="chapter-head">
        <span class="chapter-num">${String(i + 1).padStart(2, "0")}</span>
        <h2>${c.h}</h2>
      </div>
      ${c.body}
    </section>
  `).join("") + `<footer class="colophon">Nexa &middot; ${t.docKicker}</footer>`;

  try { localStorage.setItem("nexa-doc-lang", lang); } catch (e) {}
  updateActiveLangBtn();
  updateActiveTocLink();
}

function updateActiveLangBtn() {
  document.querySelectorAll(".lang-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === current);
    b.setAttribute("aria-pressed", b.dataset.lang === current ? "true" : "false");
  });
}

function updateActiveTocLink() {
  const links = Array.from(document.querySelectorAll(".toc a"));
  const sections = links.map(l => document.getElementById(l.getAttribute("href").slice(1)));
  let activeIdx = 0;
  sections.forEach((s, i) => { if (s && s.getBoundingClientRect().top - 80 <= 0) activeIdx = i; });
  links.forEach((l, i) => l.classList.toggle("active", i === activeIdx));
}

const langSwitch = document.getElementById("langSwitch");
langSwitch.innerHTML = LANGS.map(l => `<button class="lang-btn" data-lang="${l.code}" title="${l.name}">${l.label}</button>`).join("");
langSwitch.addEventListener("click", e => {
  const btn = e.target.closest(".lang-btn");
  if (btn) render(btn.dataset.lang);
});

document.addEventListener("scroll", () => { window.requestAnimationFrame(updateActiveTocLink); }, { passive: true });

let initial = "en";
try {
  const saved = localStorage.getItem("nexa-doc-lang");
  if (saved && T[saved]) initial = saved;
  else {
    const nav = (navigator.language || "en").slice(0, 2);
    if (T[nav]) initial = nav;
  }
} catch (e) {}
render(initial);
</script>
